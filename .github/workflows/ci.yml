name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    permissions: write-all
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: [ '3.0', '3.1', '3.2', '3.3', '3.4', '4.0' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake spec:all
      - uses: joshmfrankel/simplecov-check-action@main
        with:
          minimum_suite_coverage: 95
          minimum_file_coverage: 80
          github_token: ${{ secrets.GITHUB_TOKEN }}
        # Fork PRs get a read-only GITHUB_TOKEN, so the action can't create its check run there
        if: matrix.ruby-version == '4.0' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)

  rubocop:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Run rubocop
        run: |
          bundle exec rubocop --format github
